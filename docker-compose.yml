services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cedar-agent:
    image: permitio/cedar-agent:latest
    ports:
      - "8180:8180"
    volumes:
      - ./policies/cedar:/policies
    environment:
      - CEDAR_AGENT_ADDR=0.0.0.0

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - POSTGRES_DSN=postgres://aegis:aegis@postgres:5432/aegis
      - REDIS_ADDR=redis:6379
      - SIGNING_KEY_PATH=/data/identity_signing_key
      - BASE_LEASE_SECONDS=45
      - THROTTLE_LEASE_SECONDS=10
      - LEASE_JITTER_PCT=0.20
      - CONTAINMENT_ADDR=http://containment-controller:8083
    volumes:
      - identity-keys:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      containment-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  budget-ledger:
    build:
      context: .
      dockerfile: services/budget-ledger/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://aegis:aegis@postgres:5432/aegis
      - REAPER_INTERVAL_SECONDS=5
      - DEMO_NAIVE_MODE=true
      - THROTTLE_VELOCITY_CAP_PER_MIN=5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  containment-controller:
    build:
      context: .
      dockerfile: services/containment-controller/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://aegis:aegis@postgres:5432/aegis
      - THROTTLE_VELOCITY_CAP_PER_MIN=5
      - RAILS_ADDR=http://mock-rails:8090
      - BUDGET_ADDR=http://budget-ledger:8082
      - AUDIT_ADDR=http://audit-chain:8084
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-rails:
        condition: service_started
      audit-chain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-rails:
    build:
      context: .
      dockerfile: services/mock-rails/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PORT=8090

  audit-chain:
    build:
      context: .
      dockerfile: services/audit-chain/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - POSTGRES_DSN=postgres://aegis:aegis@postgres:5432/aegis
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RAILS_ADDR=http://mock-rails:8090
      - AUDIT_ADDR=http://audit-chain:8084
      - IDENTITY_ADDR=http://identity-service:8081
      - POLICY_ADDR=http://cedar-agent:8180
      - BUDGET_ADDR=http://budget-ledger:8082
      - CONTAINMENT_ADDR=http://containment-controller:8083
      - REDIS_ADDR=redis:6379
      - EPOCH_STALENESS_BOUND_SECONDS=2
    depends_on:
      mock-rails:
        condition: service_started
      audit-chain:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      budget-ledger:
        condition: service_healthy
      containment-controller:
        condition: service_healthy
      cedar-agent:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
      containment-controller:
        condition: service_healthy
      budget-ledger:
        condition: service_healthy
      identity-service:
        condition: service_healthy

  agent-sim:
    build:
      context: .
      dockerfile: simulation/agent-sim/Dockerfile
    environment:
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    restart: "no"

volumes:
  identity-keys:
